[project]
name = "heart-failure-prediction"
version = "1.0.0"
description = "Heart Failure Prediction (HFP) - ML-based heart failure risk prediction web application"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "email-validator>=2.1",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
report = [
    "python-docx>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["backend", "ml"]
